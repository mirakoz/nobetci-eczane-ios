name: NobetciEczane
options:
  bundleIdPrefix: com.nobetci
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

targets:
  NobetciEczane:
    type: application
    platform: iOS
    sources:
      - path: NobetciEczane
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: NobetciEczane/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.nobetci.eczane
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NobetciEczane/Info.plist
      properties:
        CFBundleDisplayName: Nöbetçi Eczane
        CFBundleName: NobetciEczane
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        NSLocationWhenInUseUsageDescription: "Nöbetçi eczaneleri bulmak için konumunuzu kullanmak istiyoruz."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Nöbetçi eczaneleri bulmak için konumunuzu kullanmak istiyoruz."
        ITSAppUsesNonExemptEncryption: false
